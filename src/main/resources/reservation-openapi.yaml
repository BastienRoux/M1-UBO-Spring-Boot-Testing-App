openapi: 3.0.3
info:
  title: API Reservations
  version: 1.1.0
  description: |
    API de reservation de films.
    Le paiement est delegue a une API externe (autre groupe) et doit etre valide
    avant confirmation definitive de la reservation.

externalDocs:
  description: Contrat API de pseudo-paiement (groupe partenaire)
  url: https://example.org/payment-team-openapi

paths:
  /reservations:
    get:
      summary: Lister toutes les reservations
      tags: [Reservations]
      responses:
        '200':
          description: Liste des reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
    post:
      summary: Creer une reservation
      description: |
        Regles metier a verifier cote backend:
        - max 3 reservations actives par utilisateur
        - age minimum requis pour le film
        - validation de paiement via l'API externe
      tags: [Reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: Reservation creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Requete invalide
        '402':
          description: Paiement refuse par l'API externe
        '409':
          description: Regle metier non respectee

  /reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Recuperer une reservation par identifiant
      tags: [Reservations]
      responses:
        '200':
          description: Reservation trouvee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: Reservation non trouvee
    delete:
      summary: Cloturer une reservation (fin de location)
      description: Ne supprime pas l'historique, passe le statut en ENDED.
      tags: [Reservations]
      responses:
        '200':
          description: Reservation cloturee
        '404':
          description: Reservation non trouvee

  /reservations/user/{userId}:
    get:
      summary: Lister les reservations d'un utilisateur
      tags: [Reservations]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reservations de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'

  /reservations/movie/{movieId}:
    get:
      summary: Lister les reservations d'un film
      tags: [Reservations]
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reservations du film
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'

  /reservations/check:
    get:
      summary: Verifier si un utilisateur a deja loue un film
      tags: [Reservations]
      parameters:
        - name: movieId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Resultat booleen
          content:
            application/json:
              schema:
                type: boolean

components:
  schemas:
    Reservation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        movieId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ENDED]
        movieTitle:
          type: string
        userPseudo:
          type: string
        paymentTransactionId:
          type: string
          description: Reference retournee par l'API de paiement externe.

    ReservationCreateRequest:
      type: object
      required: [movieId, userId]
      properties:
        movieId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        paymentToken:
          type: string
          description: Jeton provenant de l'API de paiement externe.