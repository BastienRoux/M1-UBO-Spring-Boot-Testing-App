openapi: 3.0.3
info:
  title: API Artistes
  version: 1.1.0
  description: API de gestion des artistes avec filtrage par role (acteur/realisateur).

paths:
  /artists:
    get:
      summary: Lister les artistes
      tags: [Artistes]
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [ACTOR, DIRECTOR]
          description: Filtrer les artistes par role metier.
      responses:
        '200':
          description: Liste des artistes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artist'
    post:
      summary: Creer un artiste
      tags: [Artistes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistInput'
      responses:
        '201':
          description: Artiste cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'

  /artists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Recuperer un artiste par identifiant
      tags: [Artistes]
      responses:
        '200':
          description: Artiste trouve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '404':
          description: Artiste non trouve
    put:
      summary: Mettre a jour un artiste
      tags: [Artistes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistInput'
      responses:
        '200':
          description: Artiste mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '404':
          description: Artiste non trouve
    delete:
      summary: Supprimer un artiste
      tags: [Artistes]
      responses:
        '204':
          description: Artiste supprime
        '404':
          description: Artiste non trouve

components:
  schemas:
    Artist:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          enum: [ACTOR, DIRECTOR]
        genre:
          type: string
        biography:
          type: string

    ArtistInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
          enum: [ACTOR, DIRECTOR]
        genre:
          type: string
        biography:
          type: string