openapi: 3.0.3
info:
  title: API Reviews
  version: 1.1.0
  description: |
    API d'evaluations developpee en Servlet avec stockage MongoDB.
    Les notes sont strictement comprises entre 0 et 5.

paths:
  /reviews:
    get:
      summary: Lister toutes les evaluations
      tags: [Reviews]
      responses:
        '200':
          description: Liste des evaluations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      summary: Ajouter une evaluation
      description: L'utilisateur doit avoir reserve le film.
      tags: [Reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Evaluation creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Donnees invalides (dont note hors bornes)
        '403':
          description: Utilisateur non autorise a evaluer ce film

  /reviews/movie/{movieId}:
    get:
      summary: Recuperer les evaluations d'un film
      tags: [Reviews]
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Evaluations du film
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

  /reviews/movie/{movieId}/average:
    get:
      summary: Recuperer la moyenne des notes d'un film
      tags: [Reviews]
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Moyenne des notes
          content:
            text/plain:
              schema:
                type: number
                format: double

  /reviews/user/{userId}:
    get:
      summary: Recuperer les evaluations d'un utilisateur
      tags: [Reviews]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Evaluations de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

components:
  schemas:
    Review:
      type: object
      properties:
        id:
          type: string
        movieId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userPseudo:
          type: string
          description: Pseudo de l'utilisateur createur de l'evaluation.
        rating:
          type: integer
          minimum: 0
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewInput:
      type: object
      required: [movieId, userId, rating]
      properties:
        movieId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userPseudo:
          type: string
        rating:
          type: integer
          minimum: 0
          maximum: 5
        comment:
          type: string